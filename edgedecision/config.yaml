name: EdgeDecision
version: "1.0.0"
slug: edgedecision
url: https://github.com/Lucapgt/edgedecision
description: Local decision engine for Assist (9 languages, no fixed phrases, Raspberry Pi 5 friendly)
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ports:
  8765/tcp: null
ports_description:
  8765/tcp: API EdgeDecision (POST /decide)
map:
  - share:rw
options:
  mode: demo
  model: 7c
  threads: 4
  lang: it
  expose_all: false
  allow_off_all: false
  save_history: false
schema:
  mode: list(demo|homeassistant)
  model: list(7c)
  threads: int(1,4)
  lang: list(it|en|es|fr|de|nl|pt|pl|sv)
  expose_all: bool
  allow_off_all: bool
  save_history: bool
